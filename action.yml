name: 'BuildLens'
description: 'Continuous runtime dependency monitoring & credential exfiltration detection for CI builds'
author: 'BuildLens'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  mode:
    description: 'Execution mode (observe only)'
    required: false
    default: 'observe'
  manifest:
    description: 'Path to write run manifest JSON'
    required: false
    default: 'buildlens-manifest.json'
  sarif:
    description: 'Path to write SARIF report'
    required: false
    default: 'buildlens.sarif'
  debug:
    description: 'Stream all raw events to disk (debug mode)'
    required: false
    default: 'false'
  lockfile:
    description: 'Path to package lockfile used for attribution'
    required: false
    default: 'package-lock.json'
  upload-sarif:
    description: 'Upload the SARIF to GitHub code scanning at the end of the job (needs `security-events: write`)'
    required: false
    default: 'false'
  token:
    description: 'Token used for the SARIF upload'
    required: false
    default: '${{ github.token }}'

outputs:
  manifest:
    description: 'Path to generated manifest'
  sarif:
    description: 'Path to generated SARIF'
  status:
    description: 'Run status (clean, findings, degraded)'
  findings_count:
    description: 'Number of detected security findings'

runs:
  using: 'node24'
  main: 'action/main.js'
  post: 'action/post.js'
  post-if: 'always()'

