# Release: push a tag like v0.1.0 and this workflow builds bl-agent for Linux amd64,
# commits the binary onto a release-only commit (never onto a branch), moves the
# version tag and the major tag (v0) to that commit, and publishes a GitHub release.
# Users pin the tag; the action finds action/bin/linux-amd64/bl-agent inside it.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, commit binary, publish release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Install BPF toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
          BPFTOOL_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/libbpf/bpftool/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*bpftool-[^"]*-amd64\.tar\.gz"' \
            | head -1 | cut -d'"' -f4)
          test -n "$BPFTOOL_URL" || (echo "failed to resolve bpftool release download URL" && exit 1)
          curl -fsSL "$BPFTOOL_URL" -o /tmp/bpftool.tar.gz
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Generate vmlinux.h
        run: |
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > pkg/agent/bpf/vmlinux.h

      - name: Generate BPF code
        run: |
          go mod tidy
          (cd pkg/agent && go generate ./...)

      - name: Test
        run: go test ./pkg/attribution ./pkg/correlate ./pkg/agent ./cmd/bl-agent

      - name: Build release binary
        run: |
          mkdir -p dist action/bin/linux-amd64
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/bl-agent-linux-amd64 ./cmd/bl-agent
          cp dist/bl-agent-linux-amd64 action/bin/linux-amd64/bl-agent
          chmod +x action/bin/linux-amd64/bl-agent
          (cd dist && sha256sum bl-agent-linux-amd64 > bl-agent-linux-amd64.sha256)
          cat dist/bl-agent-linux-amd64.sha256

      - name: Commit binary onto the release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          SHA=$(cut -d' ' -f1 dist/bl-agent-linux-amd64.sha256)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          # bin/ is gitignored on branches; the binary only ever lives on release commits
          git add -f action/bin/linux-amd64/bl-agent
          git commit -m "release ${TAG}: prebuilt bl-agent (linux-amd64)" -m "sha256 ${SHA}" -m "built from $(git rev-parse --short HEAD~1)"
          git tag -fa "$TAG" -m "BuildLens ${TAG}"
          git tag -fa "$MAJOR" -m "BuildLens ${TAG}"
          git push -f origin "refs/tags/${TAG}" "refs/tags/${MAJOR}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA=$(cut -d' ' -f1 dist/bl-agent-linux-amd64.sha256)
          cat > notes.md <<EOF
          Early preview. Add as the first step of a job:

          \`\`\`yaml
          - uses: ${GITHUB_REPOSITORY}@${TAG}
          \`\`\`

          The tag includes the prebuilt agent at \`action/bin/linux-amd64/bl-agent\`.
          SHA-256: \`${SHA}\`

          Needs a Linux x86-64 runner with kernel BTF and passwordless sudo (GitHub-hosted Ubuntu).
          Otherwise it warns and exits 0. See the README for requirements and known limits.
          EOF
          gh release create "$TAG" dist/bl-agent-linux-amd64 dist/bl-agent-linux-amd64.sha256 \
            --title "BuildLens ${TAG}" --notes-file notes.md --prerelease --verify-tag
