# Phase 0 feasibility spike (ROADMAP.md "Phase 0 — Feasibility spike").
#
# Everything here runs on GitHub's own ephemeral runners. It never touches
# a developer machine, by design — see STRATEGY / ROADMAP for why: the only
# question worth answering is whether GitHub-hosted runners themselves
# support what BuildLens needs. Delete or replace this workflow once
# Phase 0 concludes; it is not meant to become the product's CI.
name: phase0-spike

on:
  workflow_dispatch:
  push:
    paths:
      - "spike/**"
      - ".github/workflows/phase0-spike.yml"

permissions:
  contents: read

jobs:
  # CP-0.1 / M0.1 / M0.2 / M0.3: does a real eBPF program load and emit
  # events on each target kernel? Answered per-kernel by exit code +
  # captured event count, not by opinion.
  kernel-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install BPF toolchain
        env:
          # Unauthenticated api.github.com calls are capped at 60/hour/IP —
          # a two-job matrix sharing a runner IP pool can trip that. Every
          # Actions job gets a token for free; using it raises the cap to
          # 5000/hour and makes this a non-issue.
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
          # apt's linux-tools-<kernel> package lags brand-new hosted kernel
          # builds (hit this on 6.17.0-1020-azure: no matching package yet).
          # libbpf's static "bootstrap" bpftool reads BTF at runtime and
          # isn't tied to a kernel-specific package at all — use that instead.
          BPFTOOL_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/libbpf/bpftool/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*bpftool-[^"]*-amd64\.tar\.gz"' \
            | head -1 | cut -d'"' -f4)
          test -n "$BPFTOOL_URL" || (echo "failed to resolve bpftool release download URL" && exit 1)
          curl -fsSL "$BPFTOOL_URL" -o /tmp/bpftool.tar.gz
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Record kernel feature matrix (M0.2)
        run: |
          mkdir -p out
          {
            echo "kernel: $(uname -r)"
            echo "arch: $(uname -m)"
            echo "btf_present: $(test -f /sys/kernel/btf/vmlinux && echo yes || echo no)"
            echo "unprivileged_bpf_disabled: $(cat /proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null || echo unknown)"
            echo "lsm_active: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
            echo "bpftool_present: $(command -v bpftool >/dev/null && echo yes || echo no)"
          } | tee out/kernel-info-${{ matrix.os }}.txt

      - name: Generate vmlinux.h from this runner's own BTF
        run: |
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > spike/bpf/vmlinux.h
          wc -l spike/bpf/vmlinux.h

      - name: go mod tidy
        run: go mod tidy

      - name: go generate (compile the BPF object via bpf2go)
        working-directory: spike/cmd/spike
        run: go generate ./...

      - name: Build spike loader
        run: go build -o bin/spike ./spike/cmd/spike

      - name: Load probe and capture real exec events (M0.1, M0.3)
        run: |
          OUT_FILE=out/events-${{ matrix.os }}.jsonl
          sudo ./bin/spike -duration 15s -out "$OUT_FILE" &
          SPIKE_PID=$!

          # Attaching (sudo spawn, BPF verifier, tracepoint link) takes real
          # wall-clock time. Wait for the readiness marker instead of
          # guessing a sleep — generating traffic before attach is complete
          # reliably produces zero events, which is what happened here first.
          for i in $(seq 1 100); do
            [ -f "$OUT_FILE.ready" ] && break
            sleep 0.1
          done
          if [ ! -f "$OUT_FILE.ready" ]; then
            echo "probe never signaled readiness within 10s"
            wait $SPIKE_PID || true
            exit 1
          fi

          # Generate some exec() traffic for the now-attached probe to observe.
          for i in $(seq 1 20); do /bin/true; done

          wait $SPIKE_PID
          EVENT_COUNT=$(wc -l < "$OUT_FILE")
          echo "captured $EVENT_COUNT exec events"
          test "$EVENT_COUNT" -gt 0 || (echo "CP-0.1 FAIL: zero events captured on ${{ matrix.os }}" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-evidence-${{ matrix.os }}
          path: out/

  # M0.5 / CP-0.3 evidence: is the read-then-egress correlation actually
  # visible in raw events? A synthetic postinstall script reads a fake
  # .env and POSTs it to a listener on 127.0.0.1 -- nothing leaves the
  # runner. If the probes are working, spike emits a TAINTED_EGRESS
  # record tying the read to the connect. This job's artifact is the
  # "BuildLens's output" half of the CP-0.3-CHECKLIST.md comparison.
  detection-proof:
    needs: kernel-matrix
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install BPF toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
          BPFTOOL_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/libbpf/bpftool/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*bpftool-[^"]*-amd64\.tar\.gz"' \
            | head -1 | cut -d'"' -f4)
          test -n "$BPFTOOL_URL" || (echo "failed to resolve bpftool release download URL" && exit 1)
          curl -fsSL "$BPFTOOL_URL" -o /tmp/bpftool.tar.gz
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Build spike loader
        run: |
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > spike/bpf/vmlinux.h
          go mod tidy
          (cd spike/cmd/spike && go generate ./...)
          go build -o bin/spike ./spike/cmd/spike

      - name: Start local listener (stands in for the attacker's server)
        run: |
          mkdir -p out
          python3 spike/fixtures/local_listener.py > out/listener.log 2>&1 &
          echo $! > /tmp/listener.pid
          sleep 1

      - name: Load probe, trigger the synthetic malicious install, check correlation
        run: |
          OUT_FILE=out/detection-proof.jsonl
          sudo ./bin/spike -duration 30s -out "$OUT_FILE" &
          SPIKE_PID=$!

          for i in $(seq 1 100); do
            [ -f "$OUT_FILE.ready" ] && break
            sleep 0.1
          done
          if [ ! -f "$OUT_FILE.ready" ]; then
            echo "probe never signaled readiness within 10s"
            exit 1
          fi

          (cd spike/fixtures/detection-demo && npm install --no-audit --no-fund)

          sleep 1 # let the last ring buffer events land before we stop reading
          sudo kill "$SPIKE_PID" 2>/dev/null || true
          wait "$SPIKE_PID" 2>/dev/null || true
          kill "$(cat /tmp/listener.pid)" 2>/dev/null || true

          echo "--- listener log (what the 'attacker' received) ---"
          cat out/listener.log
          echo "--- raw probe events ---"
          cat "$OUT_FILE"

          echo "--- correlation check ---"
          if grep -q '"type":"TAINTED_EGRESS"' "$OUT_FILE"; then
            echo "M0.5 PASS: read-then-egress correlation captured in raw events"
          else
            echo "M0.5 FAIL: no TAINTED_EGRESS record found"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-detection-proof
          path: out/

  # CP-0.2: added wall-clock overhead of running the probe during a real
  # install. 30 paired runs per side, per ROADMAP.md. Two prior passes
  # (7.7% at N=5, 7.4% at N=30) both reloaded and reattached the probe
  # before every single npm ci call — a real deployment attaches once per
  # job, not once per command, so both numbers overstated the one-time
  # BPF load/attach cost by paying it 30x instead of once. Now attaches
  # once and stays running across all 30 runs, matching production.
  overhead-benchmark:
    needs: kernel-matrix
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install BPF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev time
          BPFTOOL_URL=$(curl -fsSL https://api.github.com/repos/libbpf/bpftool/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*bpftool-[^"]*-amd64\.tar\.gz"' \
            | head -1 | cut -d'"' -f4)
          curl -fsSL "$BPFTOOL_URL" -o /tmp/bpftool.tar.gz
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Build production bl-agent and spike loader
        run: |
          mkdir -p bin action/bin/linux-amd64 out
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > spike/bpf/vmlinux.h
          cp spike/bpf/vmlinux.h pkg/agent/bpf/vmlinux.h
          go mod tidy
          (cd spike/cmd/spike && go generate ./...)
          (cd pkg/agent && go generate ./...)
          go build -o bin/spike ./spike/cmd/spike
          go build -o bin/bl-agent ./cmd/bl-agent
          cp bin/bl-agent action/bin/linux-amd64/bl-agent

      - name: Generate realistic fixture lockfile
        working-directory: spike/fixtures/realistic-node-app
        run: npm install --package-lock-only

      - name: Run paired benchmark across probe configurations
        run: |
          python3 spike/bench/run_benchmark.py \
            --app-dir spike/fixtures/realistic-node-app \
            --workload "npm ci --silent && npm run build && npm test" \
            --agent-bin bin/bl-agent \
            --pairs 15 \
            --out-dir out

          echo "### CP-0.2 Benchmark Results (realistic-node-app)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/overhead.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Verify CP-0.2 gate (overhead <= 5%) on normal full probe
          grep -q "pass=true" out/overhead.txt || (echo "CP-0.2 FAIL: overhead exceeds 5% or ring buffer dropped events" && exit 1)
          echo "CP-0.2 PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-overhead
          path: out/
